<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>V23 Post-processing Exact Pixel Regression</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 768px;
        height: 512px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <output id="status">running</output>
    <script src="../../vendor/three-0.160.0.min.js"></script>
    <script src="../../src/rendering/Neon_Autopilot_V23_HighSpeed_DroneHeat.postprocessing.js?v=23-ipad-road-residency-253"></script>
    <script>
      'use strict';

      (async () => {
        const status = document.querySelector('#status');
        const width = 96;
        const height = 64;
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
        renderer.setPixelRatio(1);
        renderer.setSize(width, height, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.84;
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4f_6d_82);
        const camera = new THREE.PerspectiveCamera(54, width / height, 0.1, 100);
        camera.position.set(0, 1.6, 5.4);
        camera.lookAt(0, 0.2, 0);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(12, 8),
          new THREE.MeshBasicMaterial({ color: 0x91_93_8f })
        );
        floor.position.set(0, -1.1, -1.8);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const block = new THREE.Mesh(
          new THREE.BoxGeometry(1.8, 1.8, 1.8),
          new THREE.MeshBasicMaterial({ color: 0x76_82_8d })
        );
        block.position.set(-0.9, -0.1, -1.2);
        block.rotation.set(0.18, 0.42, 0.08);
        scene.add(block);

        const bloom = new THREE.Mesh(
          new THREE.SphereGeometry(0.54, 24, 16),
          new THREE.MeshBasicMaterial({ color: 0xff_d7_72 })
        );
        bloom.position.set(1.15, 0.18, -0.35);
        scene.add(bloom);
        window.NeonV23PostProcessing.tagBloom(bloom, true);

        const legacy = window.NeonV23PostProcessing.create({
          THREE,
          renderer,
          scene,
          camera,
          auditLegacyPipeline: true
        });
        const optimized = window.NeonV23PostProcessing.create({ THREE, renderer, scene, camera });
        for (const pipeline of [legacy, optimized]) {
          pipeline.setSize(width, height, 1);
          pipeline.setEnabled(true);
        }

        const targetOptions = {
          minFilter: THREE.NearestFilter,
          magFilter: THREE.NearestFilter,
          format: THREE.RGBAFormat,
          type: THREE.UnsignedByteType,
          depthBuffer: false,
          stencilBuffer: false
        };
        const legacyTarget = new THREE.WebGLRenderTarget(width, height, targetOptions);
        const optimizedTarget = new THREE.WebGLRenderTarget(width, height, targetOptions);
        const repeatedTarget = new THREE.WebGLRenderTarget(width, height, targetOptions);

        function capture(pipeline, target) {
          renderer.setRenderTarget(target);
          renderer.setClearColor(0x00_00_00, 1);
          renderer.clear(true, true, true);
          pipeline.render();
          const pixels = new Uint8Array(width * height * 4);
          renderer.readRenderTargetPixels(target, 0, 0, width, height, pixels);
          return pixels;
        }

        function compare(left, right) {
          let differingChannels = 0;
          let maximumDelta = 0;
          for (let index = 0; index < left.length; index++) {
            const delta = Math.abs(left[index] - right[index]);
            if (delta !== 0) differingChannels++;
            maximumDelta = Math.max(maximumDelta, delta);
          }
          return { differingChannels, maximumDelta };
        }

        // The same renderer, scene, camera, targets, formats, AA samples, and shader inputs isolate only removed work.
        const legacyPixels = capture(legacy, legacyTarget);
        const optimizedPixels = capture(optimized, optimizedTarget);
        const repeatedPixels = capture(optimized, repeatedTarget);
        const legacyComparison = compare(legacyPixels, optimizedPixels);
        const stabilityComparison = compare(optimizedPixels, repeatedPixels);
        const result = {
          width,
          height,
          effectiveSamples: optimized.getDiagnostics().effectiveSamples,
          legacyDifferingChannels: legacyComparison.differingChannels,
          legacyMaximumDelta: legacyComparison.maximumDelta,
          repeatedDifferingChannels: stabilityComparison.differingChannels,
          repeatedMaximumDelta: stabilityComparison.maximumDelta
        };

        document.documentElement.dataset.pixelAuditReady = 'true';
        document.documentElement.dataset.pixelAuditResult = JSON.stringify(result);
        status.value = JSON.stringify(result);
        status.textContent = JSON.stringify(result);

        for (const pipeline of [legacy, optimized]) pipeline.dispose();
        for (const target of [legacyTarget, optimizedTarget, repeatedTarget]) target.dispose();
        renderer.dispose();
      })().catch((error) => {
        document.documentElement.dataset.pixelAuditReady = 'error';
        document.documentElement.dataset.pixelAuditResult = String(error?.stack || error);
        document.querySelector('#status').textContent = String(error?.stack || error);
      });
    </script>
  </body>
</html>
